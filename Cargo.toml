[workspace]
resolver = "2"
members = ["crates/scsmm-core", "crates/scsmm-cli", "src-tauri"]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/doveis99/easy-scsmodmanager-rs"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

# Test and check builds: keep line numbers for our own crates, no debug info
# for dependencies. The full debug info of the GUI stack is several GB.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
