[package]
name = "scsmm-core"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
aes = "0.8"
cbc = "0.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
flate2 = "1.1.11"
memchr = "2.8.3"
memmap2 = "0.9.12"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.10.9"
thiserror = "2.0.21"
ureq = { version = "2", optional = true }
zip = { version = "2", default-features = false, features = ["deflate"] }

[target."cfg(windows)".dependencies]
winreg = "0.56.0"

[dev-dependencies]
tempfile = "3.27.0"
zip = { version = "2", default-features = false, features = ["deflate"] }

[features]
# HTTP access to the public Steam Workshop API. Off by default so the core
# and the CLI stay offline; the GUI turns it on.
net = ["dep:ureq"]

[[example]]
name = "workshop_lookup"
required-features = ["net"]
