<!doctype html>
<!-- the inline background paints before the stylesheet arrives -->
<html lang="en" style="background: #14171c">
  <head>
    <meta charset="UTF-8" />
    <meta name="color-scheme" content="dark" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Easy SCS Mod Manager</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <!-- Texts are filled in at start from the language files (ui/src/locales):
       data-i18n names the message for the element's text, the -placeholder,
       -aria and -title variants the one for that attribute. -->
  <body>
    <header class="topbar">
      <div class="brand">Easy SCS Mod Manager</div>
      <div class="seg" id="game-switch" role="tablist" data-i18n-aria="top.game"></div>
      <label class="field">
        <span data-i18n="top.profile"></span>
        <select id="profile-select"></select>
      </label>
      <button id="open-backups" class="btn" data-i18n="top.backups"></button>
      <div class="spacer"></div>
      <span class="muted" id="game-version"></span>
      <button id="open-settings" class="btn" data-i18n="top.settings"></button>
      <button id="rescan" class="btn" data-i18n="top.rescan"></button>
    </header>

    <main class="panes">
      <section class="pane library" data-i18n-aria="lib.aria">
        <div class="toolbar">
          <input id="search" type="search" data-i18n-placeholder="lib.search" />
          <select id="filter-category" data-i18n-aria="lib.category"></select>
          <select id="filter-source" data-i18n-aria="lib.source">
            <option value="" data-i18n="lib.allSources"></option>
            <option value="local" data-i18n="lib.local"></option>
            <option value="workshop" data-i18n="lib.workshop"></option>
          </select>
          <select id="sort" data-i18n-aria="lib.sort">
            <option value="name" data-i18n="lib.sortName"></option>
            <option value="date" data-i18n="lib.sortDate"></option>
          </select>
          <label class="check"><input type="checkbox" id="filter-favorites" /> <span data-i18n="lib.favorites"></span></label>
        </div>
        <div class="count muted" id="library-count"></div>
        <div class="grid" id="grid"></div>
      </section>

      <section class="pane order" data-i18n-aria="order.aria">
        <div class="toolbar">
          <strong class="pane-title" data-i18n="order.title"></strong>
          <div class="spacer"></div>
          <button id="open-share" class="btn" data-i18n="order.share"></button>
          <button id="show-conflicts" class="btn" data-i18n="order.conflicts" hidden></button>
          <button id="auto-sort" class="btn" data-i18n="order.autoSort"></button>
          <button id="revert" class="btn" data-i18n="order.revert" disabled></button>
          <button id="save" class="btn primary" data-i18n="common.save" disabled></button>
        </div>
        <div class="count" id="order-summary"></div>
        <div class="hint muted" data-i18n="order.hint"></div>
        <div class="rows" id="rows"></div>
      </section>
    </main>

    <footer class="status" id="status" role="status"></footer>

    <div class="modal-backdrop" id="modal" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
        <h2 id="modal-title"></h2>
        <div id="modal-body" class="modal-body"></div>
        <div id="modal-actions" class="modal-actions"></div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
